  <h1>LieRing</h1>
  <p class="lead">Symplectic ring modelling. The object of the ring is a product of Lie factors, not a stack of transport matrices.</p>

  <figure>
    <img src="docs/src/assets/architecture_object.png" alt="The ring is one Lie factor">
    <figcaption>The ring is one Lie factor. Concatenate Hamiltonians in the algebra; read Twiss, η, ξ from the product; track a point through it. An RK4 polynomial map is a check, not the ring object.</figcaption>
  </figure>
