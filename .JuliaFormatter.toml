# BlueStyle defaults, with a wider margin for physics formulae in source.
style = "blue"
margin = 100
indent = 4
always_for_in = true
whitespace_typedefs = false
whitespace_ops_in_indices = true
remove_extra_newlines = true
trailing_comma = true
trailing_zero = true
format_docstrings = false
normalize_line_endings = "auto"
