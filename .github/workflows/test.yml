name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"

# Cancel the previous run of this workflow on the same ref.
# Workflow-level (not job-level): the test matrix must stay parallel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.10"
          - "1"
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          # Missing CODECOV_TOKEN must not fail the job.
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"
      - uses: julia-actions/cache@v2
      # docs/Project.toml records Bell with [sources] (Pkg on Julia 1.11+).
      # Julia 1.10 ignores that table, so develop the checkout explicitly.
      # This job only builds; it does not deploy to gh-pages.
      - name: Instantiate docs project
        run: julia --project=docs -e "using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()"
      - name: Build documentation
        env:
          GKSwstype: nul
        run: julia --project=docs docs/make.jl
