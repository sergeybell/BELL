name: Bug report
description: A defect in the code, the tests, or a numerical result
title: "fix: "
labels:
  - bug
body:
  - type: input
    id: title
    attributes:
      label: Title
      description: A short statement of the defect.
      placeholder: Drift map disagrees with the exact track
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is broken, and under which conditions.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, the lattice, and the map order.
      placeholder: |
        1. julia --project=.
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What the result should be.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What the result actually is.
    validations:
      required: true
  - type: input
    id: julia_version
    attributes:
      label: Julia version
      description: Output of `julia --version`.
      placeholder: julia version 1.10.5
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      description: The operating system and, if it matters, the architecture.
      placeholder: Windows 10 x64
    validations:
      required: true
