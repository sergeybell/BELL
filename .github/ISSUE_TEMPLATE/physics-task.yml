name: Physics task
description: A physical model of an element, or a numerical check
title: "feat: "
labels:
  - physics
body:
  - type: textarea
    id: goal
    attributes:
      label: Physics goal
      description: Which element, Hamiltonian, or observable, and what the result should be.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Formulas, papers, and lattice files.
      placeholder: |
        - docs/src/dev/...
        - Wolski procedure, or a lattice file
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Numerical checks — the reference, the tolerance, and which test records them.
      placeholder: |
        - thin RF map vs rf_kick, coefficients to 2e-15
        - Q_s vs Smooth within 1.5e-5
    validations:
      required: true
