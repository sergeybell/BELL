name: Feature
description: A new capability of the package
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What to add. Use type and function names as in the code.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why a lattice user or a developer needs this.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: When the task counts as done.
    validations:
      required: true
